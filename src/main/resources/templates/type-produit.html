<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Types de produits</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/produit">

            Gestion des produits

        </a>

        <div>

            <a
                    href="/produit"
                    class="btn btn-outline-light btn-sm me-2">

                Produits

            </a>

            <a
                    href="/type-produit"
                    class="btn btn-outline-light btn-sm">

                Types

            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>Types de produits</h1>

            <p class="text-muted">
                Gestion des catégories de produits
            </p>

        </div>

        <a
                href="/type-produit/new"
                class="btn btn-primary">

            + Nouveau type

        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Libellé</th>

                        <th class="text-center">
                            Actions
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="type : ${typeProduits}">

                        <td th:text="${type.id}">
                            1
                        </td>

                        <td>

                            <span
                                    class="badge bg-primary"
                                    th:text="${type.libelle}">

                                Informatique

                            </span>

                        </td>

                        <td class="text-center">

                            <a
                                    th:href="@{/type-produit/edit/{id}(id=${type.id})}"
                                    class="btn btn-sm btn-warning">

                                Modifier

                            </a>


                            <form
                                    th:action="@{/type-produit/delete/{id}(id=${type.id})}"
                                    method="post"
                                    class="d-inline">

                                <input
                                        type="hidden"
                                        name="_method"
                                        value="DELETE">

                                <button
                                        type="submit"
                                        class="btn btn-sm btn-danger"
                                        onclick="return confirm('Voulez-vous vraiment supprimer ce type ?')">

                                    Supprimer

                                </button>

                            </form>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(typeProduits)}">

                        <td
                                colspan="3"
                                class="text-center py-5 text-muted">

                            Aucun type de produit trouvé.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
