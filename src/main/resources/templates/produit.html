<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Produits</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/produit">
            Gestion des produits
        </a>

        <div>
            <a href="/produit"
               class="btn btn-outline-light btn-sm me-2">
                Produits
            </a>

            <a href="/type-produit"
               class="btn btn-outline-light btn-sm">
                Types de produits
            </a>
        </div>

    </div>
</nav>


<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="mb-1">Produits</h1>
            <p class="text-muted">
                Liste des produits disponibles
            </p>
        </div>

        <a href="/produit/new"
           class="btn btn-primary">
            + Nouveau produit
        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Libellé</th>
                        <th>Prix</th>
                        <th>Type</th>
                        <th class="text-center">Actions</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="produit : ${produits.content}">

                        <td th:text="${produit.id}">
                            1
                        </td>

                        <td th:text="${produit.libelle}">
                            Ordinateur
                        </td>

                        <td>
                            <span th:text="${produit.prix}">
                                500000
                            </span>
                            FCFA
                        </td>

                        <td>

                            <span
                                    th:if="${produit.typeProduit != null}"
                                    class="badge bg-info text-dark"
                                    th:text="${produit.typeProduit.libelle}">
                                Informatique
                            </span>

                            <span
                                    th:if="${produit.typeProduit == null}"
                                    class="badge bg-secondary">
                                Aucun type
                            </span>

                        </td>

                        <td class="text-center">

                            <a
                                    th:href="@{/produit/edit/{id}(id=${produit.id})}"
                                    class="btn btn-sm btn-warning">
                                Modifier
                            </a>

                            <form
                                    th:action="@{/produit/delete/{id}(id=${produit.id})}"
                                    method="post"
                                    class="d-inline">

                                <input type="hidden"
                                       name="_method"
                                       value="DELETE">

                                <button
                                        type="submit"
                                        class="btn btn-sm btn-danger"
                                        onclick="return confirm('Voulez-vous vraiment supprimer ce produit ?')">
                                    Supprimer
                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${produits.empty}">

                        <td colspan="5"
                            class="text-center py-5 text-muted">

                            Aucun produit trouvé.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <div class="d-flex justify-content-between align-items-center mt-4">

        <div class="text-muted">

            Page
            <strong th:text="${produits.number + 1}">
                1
            </strong>
            sur
            <strong th:text="${produits.totalPages}">
                1
            </strong>

        </div>


        <nav>

            <ul class="pagination mb-0">

                <li class="page-item"
                    th:classappend="${produits.first} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/produit(page=0,size=${produits.size},sort='id,asc')}">

                        Première

                    </a>

                </li>


                <li class="page-item"
                    th:classappend="${produits.first} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/produit(page=${produits.number - 1},size=${produits.size},sort='id,asc')}">

                        Précédent

                    </a>

                </li>


                <li
                        class="page-item"
                        th:each="page : ${#numbers.sequence(0, produits.totalPages - 1)}"
                        th:classappend="${page == produits.number} ? 'active'">

                    <a
                            class="page-link"
                            th:href="@{/produit(page=${page},size=${produits.size},sort='id,asc')}"
                            th:text="${page + 1}">

                        1

                    </a>

                </li>



                <li class="page-item"
                    th:classappend="${produits.last} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/produit(page=${produits.number + 1},size=${produits.size},sort='id,asc')}">

                        Suivant

                    </a>

                </li>


                <li class="page-item"
                    th:classappend="${produits.last} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/produit(page=${produits.totalPages - 1},size=${produits.size},sort='id,asc')}">

                        Dernière

                    </a>

                </li>

            </ul>

        </nav>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
