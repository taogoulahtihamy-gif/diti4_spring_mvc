<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Type de produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/produit">Gestion des produits</a>
        <a href="/type-produit" class="btn btn-outline-light btn-sm">Retour</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${typeProduit.id == null ? 'Nouveau type' : 'Modifier le type'}">
                        Nouveau type
                    </h4>
                </div>

                <div class="card-body">
                    <form th:action="@{/type-produit}" th:object="${typeProduit}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-4">
                            <label for="libelle" class="form-label">Libellé</label>

                            <input type="text"
                                   id="libelle"
                                   th:field="*{libelle}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('libelle')} ? 'is-invalid' : ''"
                                   placeholder="Ex : Informatique">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('libelle')}"
                                 th:errors="*{libelle}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/type-produit" class="btn btn-secondary">
                                Annuler
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Enregistrer
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
