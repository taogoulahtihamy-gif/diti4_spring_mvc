<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${produit.id == null ? 'Nouveau produit' : 'Modifier produit'}">Produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
nav class="navbar navbar-dark bg-dark">
<div class="container">

    <a class="navbar-brand" href="/produit">
        Gestion des produits
    </a>

    <div>
        <a href="/produit"
           class="btn btn-outline-light btn-sm me-2">
            Produits
        </a>

        <a href="/type-produit"
           class="btn btn-outline-light btn-sm">
            Types de produits
        </a>
    </div>

</div>
</nav>


<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header">
            <h3 th:text="${produit.id == null ? 'Ajouter un produit' : 'Modifier le produit'}">Produit</h3>
        </div>
        <div class="card-body">


            <form th:object="${produit}"
                  th:action="${produit.id == null} ? @{/produit} : @{/produit/edit/{id}(id=${produit.id})}"
                  method="post">

                <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                    <strong>Veuillez corriger les erreurs suivantes :</strong>
                    <ul class="mb-0 mt-2">
                        <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
                    </ul>
                </div>

                <div th:if="${serviceError != null}" class="alert alert-danger" th:text="${serviceError}"></div>

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="libelle" class="form-label">Libellé</label>
                    <input type="text"
                           id="libelle"
                           th:field="*{libelle}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('libelle')} ? ' is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('libelle')}"
                         th:errors="*{libelle}"
                         class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label for="prix" class="form-label">Prix</label>
                    <input type="number"
                           id="prix"
                           step="0.01"
                           th:field="*{prix}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('prix')} ? ' is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('prix')}"
                         th:errors="*{prix}"
                         class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label for="typeProduit" class="form-label">Type de produit</label>
                    <select id="typeProduit"
                            th:field="*{typeProduit.id}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('typeProduit')} ? ' is-invalid' : ''">
                        <option value="">-- Sélectionner un type --</option>
                        <option th:each="type : ${typeProduits}"
                                th:value="${type.id}"
                                th:text="${type.libelle}">
                        </option>
                    </select>
                    <div th:if="${#fields.hasErrors('typeProduit')}"
                         th:errors="*{typeProduit}"
                         class="invalid-feedback"></div>
                </div>

                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/produit}" class="btn btn-secondary">Annuler</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
