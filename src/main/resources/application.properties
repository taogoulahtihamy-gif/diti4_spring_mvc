spring.application.name=diti4_spring_mvc_final
server.port=${SERVER_PORT:8082}

# PostgreSQL : valeurs locales par defaut, surchargeables par variables d'environnement
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/diti4_pring_mvc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate : Flyway gere le schema, Hibernate le valide seulement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Support des formulaires PUT/DELETE
spring.mvc.hiddenmethod.filter.enabled=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Etat initial de la base

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
